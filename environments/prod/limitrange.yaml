apiVersion: v1
kind: LimitRange
metadata:
  name: wattzgoat-prod-limits
  namespace: wattzgoat-prod
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 1Gi
      defaultRequest:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 100m
        memory: 256Mi