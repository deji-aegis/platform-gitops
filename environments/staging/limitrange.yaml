apiVersion: v1
kind: LimitRange
metadata:
  name: wattzgoat-staging-limits
  namespace: wattzgoat-staging
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 200m
        memory: 256Mi
      max:
        cpu: "4"
        memory: 4Gi
      min:
        cpu: 100m
        memory: 128Mi