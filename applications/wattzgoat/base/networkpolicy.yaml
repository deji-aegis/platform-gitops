apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wattzgoat
  labels:
    app.kubernetes.io/name: wattzgoat
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wattzgoat
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 5000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 5000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP