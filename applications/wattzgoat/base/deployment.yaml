apiVersion: apps/v1
kind: Deployment
metadata:
  name: wattzgoat
  labels:
    app.kubernetes.io/name: wattzgoat
    app.kubernetes.io/component: vulnerable-app
    app.kubernetes.io/part-of: aegis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wattzgoat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wattzgoat
        app.kubernetes.io/component: vulnerable-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
    spec:
      serviceAccountName: wattzgoat
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wattzgoat
          image: ghcr.io/wattzgoat/wattzgoat-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 5000
              protocol: TCP
            - name: http
              containerPort: 5001
              protocol: TCP
          env:
            - name: STANDALONE
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          livenessProbe:
            httpGet:
              path: /
              port: https
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: https
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3