apiVersion: apps/v1
kind: Deployment
metadata:
  name: wattzgoat
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: wattzgoat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wattzgoat
        app.kubernetes.io/component: vulnerable-app
    spec:
      containers:
        - name: wattzgoat
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi