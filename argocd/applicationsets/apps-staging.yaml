apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-staging
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/YOUR_ORG/platform-gitops.git
        revision: main
        directories:
          - path: applications/*/staging
  template:
    metadata:
      name: '{{.path.basename}}-{{index .path.segments 1}}'
    spec:
      project: apps-staging
      source:
        repoURL: https://github.com/YOUR_ORG/platform-gitops.git
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{index .path.segments 1}}-staging'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false