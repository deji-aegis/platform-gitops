apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps-prod
  namespace: argocd
spec:
  description: Production applications
  sourceRepos:
    - "https://github.com/YOUR_ORG/platform-gitops.git"
  destinations:
    - namespace: "wattzgoat-prod"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: "apps"
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: monitoring.coreos.com
      kind: ServiceMonitor
  orphanedResources:
    warn: true
  syncPolicy:
    syncOptions:
      - CreateNamespace=false