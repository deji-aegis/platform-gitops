apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform components (Kyverno, Falco, Cilium, observability)
  sourceRepos:
    - "https://github.com/YOUR_ORG/platform-gitops.git"
    - "https://charts.kyverno.io"
    - "https://falcosecurity.github.io/charts"
    - "https://helm.cilium.io"
    - "https://prometheus-community.github.io/helm-charts"
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
  orphanedResources:
    warn: true